name: Release ROM

on:
  push:
    tags:
      - 'v*.*'

permissions:
  contents: read

jobs:
  validate-tag:
    runs-on: ubuntu-24.04
    outputs:
      valid: ${{ steps.tag.outputs.valid }}
    steps:
      - id: tag
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+$ ]]; then
            echo 'valid=true' >> "$GITHUB_OUTPUT"
          else
            echo 'valid=false' >> "$GITHUB_OUTPUT"
          fi
  build:
    needs: validate-tag
    if: needs.validate-tag.outputs.valid == 'true'
    uses: ./.github/workflows/build.yml
  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: WastesEdge-ROM
          path: release
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" release/WastesEdge.v32 \
            --title "Waste's Edge V32 $TAG" --verify-tag
